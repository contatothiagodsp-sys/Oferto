<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Só a fonte embutida (Montserrat, OFL 1.1): render determinístico, sem fontes do sistema. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <!-- cache efêmero: com read_only no compose, monte tmpfs em /tmp -->
  <cachedir>/tmp/fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Montserrat</family></prefer>
  </alias>
</fontconfig>
